<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
<defs>
  <radialGradient id="bg" cx="60%" cy="40%" r="95%">
    <stop offset="0%" stop-color="#2a2763"/><stop offset="55%" stop-color="#191739"/><stop offset="100%" stop-color="#0b0a1a"/>
  </radialGradient>
  <linearGradient id="glowline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5A524"/><stop offset=".6" stop-color="#FF7A18"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="900" height="170" rx="18" fill="url(#bg)"/>
<circle cx="40" cy="30" r="1.5" fill="#c7d2fe" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="4.6s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="140" r="1.3" fill="#c7d2fe" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="5.3s" begin="-1s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="26" r="1.4" fill="#c7d2fe" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="4.2s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="840" cy="140" r="1.6" fill="#c7d2fe" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="5.7s" begin="-0.5s" repeatCount="indefinite"/></circle>
<circle cx="740" cy="40" r="1.2" fill="#c7d2fe" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="4.9s" begin="-3s" repeatCount="indefinite"/></circle>
<rect x="-220" y="0" width="180" height="170" fill="url(#shine)" transform="skewX(-18)">
  <animate attributeName="x" values="-220;1040;-220" dur="7s" repeatCount="indefinite"/>
</rect>
<g transform="translate(70,85)">
  <circle r="34" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle r="34" fill="#F5A524" opacity=".08">
    <animate attributeName="r" values="30;38;30" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M -14 26 L -20 52 L 0 40 L 20 52 L 14 26" fill="#6366f1" opacity=".85"/>
  <path d="M -11 -2 L -3 7 L 13 -9" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="140" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Digital Egypt Pioneers</text>
<text x="140" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a9b7d0">Sponsored by Egypt's Ministry of Communications &amp; Information Technology</text>
<text x="140" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="url(#gold)">Round 3 graduate  ·  Round 5: Cross-Platform Mobile Developer, in progress</text>
<rect x="140" y="148" width="300" height="4" rx="2" fill="url(#gold)">
