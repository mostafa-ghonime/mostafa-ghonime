<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/><stop offset="1" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02569B"/><stop offset="0.5" stop-color="#13B9FD"/><stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="170" rx="18" fill="url(#bg)"/>
  <rect x="-220" y="0" width="180" height="170" fill="url(#shine)" transform="skewX(-18)">
    <animate attributeName="x" values="-220;1040;-220" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(70,85)">
    <circle r="34" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle r="34" fill="#13B9FD" opacity="0.08">
      <animate attributeName="r" values="30;38;30" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M -14 26 L -20 52 L 0 40 L 20 52 L 14 26" fill="#02569B" opacity="0.85"/>
    <path d="M -11 -2 L -3 7 L 13 -9" fill="none" stroke="#3DDC84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="140" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Digital Egypt Pioneers</text>
  <text x="140" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9fb8c4">Sponsored by Egypt's Ministry of Communications &amp; Information Technology</text>
  <text x="140" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="url(#accent)">Round 3 graduate  ·  Round 5: Cross-Platform Mobile Developer, in progress</text>
  <rect x="140" y="148" width="300" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="120;300;120" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
