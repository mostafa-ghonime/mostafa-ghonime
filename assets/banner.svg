<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/><stop offset="1" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02569B"/><stop offset="0.5" stop-color="#13B9FD"/><stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="780" cy="60" r="90" fill="#13B9FD" opacity="0.08"><animate attributeName="cy" values="60;90;60" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="220" r="70" fill="#3DDC84" opacity="0.08"><animate attributeName="cx" values="110;150;110" dur="9s" repeatCount="indefinite"/></circle>
  <text x="60" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Mostafa Ghonime</text>
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="url(#accent)">Android &amp; Flutter Developer</text>
  <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9fb8c4">Kotlin  ·  Jetpack Compose  ·  Flutter  ·  Clean Architecture</text>
  <rect x="60" y="212" width="320" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="120;320;120" dur="4s" repeatCount="indefinite"/></rect>
</svg>
